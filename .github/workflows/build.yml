name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-encoding:
    # Checks that `data/*.png` use the canonical PNG encoding (`npm run check-encoding`).
    # The bytes depend on the zlib build that `canvas` uses. The maps are made on macOS, and on
    # Linux `canvas` writes different bytes for the same pixels, so this job runs on macOS.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check PNG encoding
        run: |
          node --print "'canvas ' + require('canvas/package.json').version + ', cairo ' + require('canvas').cairoVersion"
          otool -L node_modules/canvas/build/Release/libpng16.16.dylib | grep -i libz || true
          npm run check-encoding

  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CXX: 'g++-4.8'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
          npm ci

      - name: Test
        run: |
          npx tibia-maps --version
          npx tibia-maps --from-data=./data --output-dir=./minimap
          npx tibia-maps --from-minimap=./minimap --output-dir=./data
          # git status && git diff-index --quiet HEAD --
          git status
          git diff

      - name: Build dist
        run: |
          npm run build

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.4.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          SSH: true
          SINGLE_COMMIT: true
          BASE_BRANCH: main
          BRANCH: gh-pages
          FOLDER: dist
